repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: cilium
    url: https://helm.cilium.io

hooks:
  - events: [ "prepare" ]
    showlogs: true
    command: "kubectl"
    args: [ "apply", "-k", "./prepare-hook/" ]

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.19.0
    values:
      - values/cilium-values.yaml

  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 9.4.2
    createNamespace: true
    values:
      - values/argocd-values.yaml