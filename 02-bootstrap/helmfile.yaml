repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server
  - name: cilium
    url: https://helm.cilium.io

hooks:
  - events: [ "prepare" ]
    showlogs: true
    command: "kubectl"
    args: [ "apply", "-k", "./prepare-hook/" ]

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.19.0
    wait: true
    timeout: 900
    values:
      - values/cilium-values.yaml

  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: 3.12.1
    values:
      - args:
          - --kubelet-insecure-tls

  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 9.4.2
    createNamespace: true
    values:
      - values/argocd-values.yaml