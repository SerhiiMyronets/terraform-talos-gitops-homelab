[global]
  workgroup = WORKGROUP
  security = user
  map to guest = Bad User
  guest account = nobody

[Public]
  path = /shares/samba
  browseable = yes
  writable = yes
  guest ok = yes
  force user = nobody
  create mask = 0666
  directory mask = 0777

[Scan]
  path = /shares/samba/scan
  browseable = yes
  writable = yes
  guest ok = yes
  force user = nobody

[Torrents]
  path = /shares/samba/torrents
  browseable = yes
  writable = yes
  guest ok = yes
  force user = nobody