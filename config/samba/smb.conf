[global]
  workgroup = WORKGROUP
  security = user
  map to guest = Bad User
  guest account = nobody

[Samba]
  path = /shares
  browseable = yes
  writable = yes
  guest ok = yes
  force user = nobody
  create mask = 0666
  directory mask = 0777

