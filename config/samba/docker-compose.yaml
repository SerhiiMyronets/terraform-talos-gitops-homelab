services:
  samba-mdns:
    image: servercontainers/samba
    container_name: samba-mdns
    networks:
      lan:
        ipv4_address: 192.168.1.60
    environment:
      - TZ=America/Los_Angeles
      - ADVERTISED_HOSTNAME=beelink-smb
    volumes:
      - /mnt/data/samba:/shares
      - ./smb.conf:/etc/samba/smb.conf:ro
    restart: unless-stopped

networks:
  lan_macvlan:
    external: true