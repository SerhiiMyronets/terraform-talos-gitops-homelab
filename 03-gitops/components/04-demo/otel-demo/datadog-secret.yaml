apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: otel-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-cloud
    kind: ClusterSecretStore
  target:
    name: datadog-secret
    creationPolicy: Owner
  data:
    - secretKey: DD_API_KEY
      remoteRef:
        key: /datadog/api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: DD_SITE_PARAMETER
      remoteRef:
        key: /datadog/site
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None