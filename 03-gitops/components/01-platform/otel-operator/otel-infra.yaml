apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-infra
  namespace: observability
spec:
  mode: daemonset
  # Додаємо прокидання папок з ноди в контейнер
  volumes:
    - name: hostfs
      hostPath:
        path: /
  config:
    receivers:
      hostmetrics:
        root_path: /hostfs
        collection_interval: 20s
        scrapers:
          cpu: {}
          memory: {}
          network: {}
          disk: {}
          filesystem: {}

      kubeletstats:
        collection_interval: 20s
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        auth_type: "serviceAccount"
        insecure_skip_verify: true

    processors:
      # Додаємо порожній конфіг для batch, щоб він активувався
      batch: {}

      resourcedetection:
        detectors: [env, system]

    exporters:
      debug:
        verbosity: normal

    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, kubeletstats]
          processors: [resourcedetection, batch]
          exporters: [debug]

  # Налаштування монтування для контейнера
  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer