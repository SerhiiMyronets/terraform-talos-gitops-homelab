apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-secret
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-cloud
    kind: ClusterSecretStore
  target:
    name: postgresql-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /postgresql/DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: /postgresql/DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: /postgresql/DB_NAME
    - secretKey: DB_USER
      remoteRef:
        key: /postgresql/DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /postgresql/DB_PASSWORD
    - secretKey: ROOT_PASSWORD
      remoteRef:
        key: /postgresql/ROOT_PASSWORD
