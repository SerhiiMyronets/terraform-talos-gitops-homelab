crds:
  enabled: false

# English comment: Core components settings for Talos Linux
prometheusOperator:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# English comment: Disable components that don't work on Talos by default
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # English comment: Resources for the main Prometheus DB
    resources:
      limits:
        cpu: 500m
        memory: 1536Mi # J4125 friendly limit
      requests:
        cpu: 100m
        memory: 512Mi
    
    # English comment: Retention settings to save disk and RAM
    retention: 7d
    retentionSize: "10GB"
    
    # English comment: Storage configuration for OpenEBS
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-nvme # Change to your actual storage class
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # English comment: Talos-specific fix for node-exporter
    # It avoids issues with mounting host paths
    hostNetwork: true

grafana:
  enabled: true
  # English comment: Basic resources for Grafana
  grafana.ini:
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_name: "Main Org."
      org_role: Admin
  deploymentStrategy:
    type: Recreate

    # English comment: Ensure security context is still there
    podSecurityContext:
      fsGroup: 472
    initChownData:
      enabled: false
  
  persistence:
    enabled: true
    storageClassName: local-nvme
    size: 5Gi

  # English comment: Sidecar will automatically find dashboards in ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

# English comment: Alertmanager is useful but can be heavy, let's limit it
alertmanager:
  alertmanagerSpec:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi