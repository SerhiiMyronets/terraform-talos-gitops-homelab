apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-buildkit-secret
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-cloud
    kind: ClusterSecretStore
  target:
    name: minio-buildkit-secret
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef:
        key: /minio/buildkit-accessKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secretkey
      remoteRef:
        key: /minio/buildkit-secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None