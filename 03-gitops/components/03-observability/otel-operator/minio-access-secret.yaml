apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-access-secret
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-cloud
    kind: ClusterSecretStore
  target:
    name: minio-access-secret
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef:
        key: /minio/minio-accessKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secretKey
      remoteRef:
        key: /minio/minio-secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None