apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: events-otel
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: events-otel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: events-otel
subjects:
  - kind: ServiceAccount
    name: otel-gateway-collector
    namespace: observability