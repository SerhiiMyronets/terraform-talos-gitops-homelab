apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  replicas: 1
  image: otel/opentelemetry-collector-contrib:latest

#  # Налаштування безпеки для ПОДА
#  podSecurityContext:
#    runAsNonRoot: true
#    runAsUser: 1000
#    runAsGroup: 1000
#    fsGroup: 1000
#    seccompProfile:
#      type: RuntimeDefault

#  securityContext:
#    allowPrivilegeEscalation: false
#    capabilities:
#      drop:
#        - ALL
#    privileged: false
#    readOnlyRootFilesystem: true

  config:
    receivers:
      k8s_events:
        auth_type: serviceAccount
        namespaces: []

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:

      resource/cluster_logs:
        attributes:
          - key: service.name
            value: logs
            action: upsert
          - key: service.namespace
            value: cluster
            action: upsert

      resource/cluster_events:
        attributes:
          - key: service.name
            value: events
            action: upsert
          - key: service.namespace
            value: cluster
            action: upsert

      resource/service_logs:
        attributes:
          - key: service.name
            value: logs
            action: upsert
          - key: service.namespace
            value: service
            action: upsert

      transform/events:
        log_statements:
          - context: log
            statements:
              # 1. Set default severity for all events first
              - set(severity_number, 9)
              - set(severity_text, "INFO")

              # 2. Upgrade severity for specific error conditions
              - set(severity_number, 17) where attributes["k8s.event.reason"] == "OOMKilling"
              - set(severity_text, "ERROR") where attributes["k8s.event.reason"] == "OOMKilling"

              - set(severity_number, 17) where attributes["k8s.event.reason"] == "FailedScheduling"
              - set(severity_text, "ERROR") where attributes["k8s.event.reason"] == "FailedScheduling"

              - set(severity_number, 17) where attributes["k8s.event.reason"] == "NodeNotReady"
              - set(severity_text, "ERROR") where attributes["k8s.event.reason"] == "NodeNotReady"

              # 3. Handle Warnings
              - set(severity_number, 13) where attributes["k8s.event.reason"] == "BackOff"
              - set(severity_text, "WARN") where attributes["k8s.event.reason"] == "BackOff"

      batch: {}

    exporters:
      prometheusremotewrite:
        endpoint: "http://victoria-metrics-victoria-metrics-single-server.observability.svc.cluster.local:8428/api/v1/write"
      debug:
        verbosity: normal
      otlp_http/loki:
        endpoint: "http://loki.observability.svc:3100/otlp"

    service:
      pipelines:
#        metrics:
#          receivers: [otlp]
#          processors: [batch]
#          exporters: [prometheusremotewrite, debug]
        logs/cluster_events:
          receivers: [k8s_events]
          processors: [resource/cluster_events, transform/events, batch]
          exporters: [otlp_http/loki, debug]

        logs/cluster_logs:
          receivers: [otlp]
          processors: [resource/cluster_logs, batch]
          exporters: [otlp_http/loki, debug]