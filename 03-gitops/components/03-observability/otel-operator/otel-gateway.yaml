apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  replicas: 1
  image: otel/opentelemetry-collector-contrib:latest

  # Налаштування безпеки для ПОДА
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Налаштування безпеки для КОНТЕЙНЕРА (те, що вимагає помилка)
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true

  config:
    receivers:
      k8s_events:
        auth_type: serviceAccount
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      prometheusremotewrite:
        endpoint: "http://victoria-metrics-victoria-metrics-single-server.observability.svc.cluster.local:8428/api/v1/write"
      debug:
        verbosity: normal
      otlp_http/loki:
        endpoint: "http://loki.observability.svc:3100/otlp"

    service:
      pipelines:
#        metrics:
#          receivers: [otlp]
#          processors: [batch]
#          exporters: [prometheusremotewrite, debug]
        logs:
          receivers: [otlp, k8s_events]
          processors: [batch]
          exporters: [otlp_http/loki, debug]