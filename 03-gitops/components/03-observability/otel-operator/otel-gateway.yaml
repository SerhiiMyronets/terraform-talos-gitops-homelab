apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  replicas: 1
  image: otel/opentelemetry-collector-contrib:latest

  # Налаштування безпеки для ПОДА
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Налаштування безпеки для КОНТЕЙНЕРА (те, що вимагає помилка)
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.pod.uid
            - k8s.deployment.name   # якщо є
            - k8s.labels           # всі labels як k8s.pod.label.<key>
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip     # або host.name, якщо pod IP не передається
            - sources:
                - from: resource_attribute
                  name: k8s.pod.name
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
        passthrough: false   # не пропускати, якщо не знайдено

    exporters:
      prometheusremotewrite:
        endpoint: "http://victoria-metrics-victoria-metrics-single-server.observability.svc.cluster.local:8428/api/v1/write"
      debug:
        verbosity: normal
      otlp_http/loki:
        endpoint: "http://loki.observability.svc:3100/otlp"

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite, debug]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp_http/loki, debug]