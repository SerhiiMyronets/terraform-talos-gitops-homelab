config:
  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/pods/kube-system_*/*/*.log,/var/log/pods/cilium_*/*/*.log
        Exclude_Path        /var/log/pods/observability_fluent-bit*/*/*.log
        Parser              cri
        Docker_Mode         On
        Mem_Buf_Limit       100MB
        Refresh_Interval    10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.pods.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  Off
        K8S-Logging.Exclude Off

    [FILTER]
        Name                modify
        Match               kube.*
        Add                 log_type infrastructure

  outputs: |
    [OUTPUT]
        Name                   opentelemetry
        Match                  *
        Host                   otel-gateway-collector.observability.svc
        Port                   4318
        Logs_uri               /v1/logs
        Log_response_payload   False
        Tls                    Off