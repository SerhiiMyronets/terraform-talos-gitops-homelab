# Використовуємо образ, сумісний з більшістю архітектур
image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 3.0.0

# Налаштування самого конфігу Fluent Bit
config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/pods/*/*/*.log
        Parser              docker
        Docker_Mode         On
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Refresh_Interval    10

  # Додаємо метадані Kubernetes (Labels, Annotations)
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.pods.
        Merge_Log           On
        Merge_Log_Key       log_processed
        Keep_Log            Off

  # Направляємо потік на твій OTel Collector Gateway
  outputs: |
    [OUTPUT]
        Name            otlp
        Match           *
        Host            otel-gateway-collector.observability.svc
        Port            4317
        metrics_endpoint /v1/metrics
        logs_endpoint    /v1/logs
        tls              off