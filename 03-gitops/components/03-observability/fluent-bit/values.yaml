config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Port     2020

  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/pods/kube-system_*/*/*.log
        Parser              docker
        Docker_Mode         On
        Mem_Buf_Limit       50MB

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off

  outputs: |
    [OUTPUT]
        Name                   opentelemetry
        Match                  *
        Host                   otel-gateway-collector.observability.svc
        Port                   4318
        Logs_uri               /v1/logs
        Tls                    Off