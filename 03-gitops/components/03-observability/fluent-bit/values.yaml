config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Port     2020

  inputs: |
    [INPUT]
        Name                tail
        Tag                 infra.*
        Path                /var/log/pods/kube-system_*/*/*.log,/var/log/pods/cilium_*/*/*.log,/var/log/pods/observability_*/*/*.log
        Parser              docker
        Docker_Mode         On
        Mem_Buf_Limit       50MB
        Refresh_Interval    10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               infra.*
        Kube_Tag_Prefix     infra.var.log.pods.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [FILTER]
        Name                modify
        Match               infra.*
        Add                 log_type infrastructure

  outputs: |
    [OUTPUT]
        Name                   opentelemetry
        Match                  *
        Host                   otel-gateway-collector.observability.svc
        Port                   4318
        Logs_uri               /v1/logs
        Log_response_payload   True
        Tls                    Off