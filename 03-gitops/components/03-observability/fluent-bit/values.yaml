config:
  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.<namespace>.<pod_name>.<container_name>
        Tag_Regex           (?<pod_name>.+)\/(?<container_name>.+)
        Path                /var/log/pods/kube-system_*/*/*.log,/var/log/pods/cilium_*/*/*.log,/var/log/pods/observability_*/*/*.log
        Exclude_Path        /var/log/pods/observability_fluent-bit*/*/*.log
        Parser              docker
        Docker_Mode         On
        Mem_Buf_Limit       100MB
        Refresh_Interval    10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.
        Merge_Log           On
        Keep_Log            Off
    
    [FILTER]
        Name                modify
        Match               kube.*
        Add                 log_type infrastructure

  outputs: |
    [OUTPUT]
        Name                   opentelemetry
        Match                  *
        Host                   otel-gateway-collector.observability.svc
        Port                   4318
        Logs_uri               /v1/logs
        Log_response_payload   False
        Tls                    Off