grafana.ini:
  auth:
    disable_login_form: true
  auth.anonymous:
    enabled: true
    org_role: Admin

deploymentStrategy:
  type: Recreate

adminPassword: admin

securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
initChownData:
  enabled: false

persistence:
  enabled: true
  storageClassName: local-nvme
  size: 5Gi
