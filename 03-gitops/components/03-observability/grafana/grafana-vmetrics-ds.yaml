apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-victoria-metrics
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://victoria-metrics-server.observability.svc.cluster.local:8428
        access: proxy
        isDefault: true
        jsonData:
          prometheusType: Prometheus
          timeInterval: "15s"
        editable: true