apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: core
  sources:
    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      path: 03-gitops/apps/00-core/argocd

    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.4.2
      helm:
        valueFiles:
          - $values/02-bootstrap/values/argocd-values.yaml

    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-ebs
  namespace: argocd
spec:
  project: core
  sources:
    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      path: 03-gitops/apps/00-core/open-ebs

    - repoURL: https://openebs.github.io/openebs
