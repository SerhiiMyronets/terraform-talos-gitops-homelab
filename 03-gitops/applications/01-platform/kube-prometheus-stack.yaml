apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      path: 03-gitops/components/01-platform/kube-prometheus-stack

    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 82.1.1
      helm:
        valueFiles:
          - $values/03-gitops/components/01-platform/kube-prometheus-stack/values.yaml

    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true