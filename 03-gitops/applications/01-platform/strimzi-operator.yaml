apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      path: 03-gitops/components/01-platform/strimzi

    - repoURL: https://strimzi.io/charts
      chart: https://strimzi.io/charts
      targetRevision: 0.50.1
      helm:
        valueFiles:
          - $values/03-gitops/components/01-platform/strimzi/values.yaml

    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-operator
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true