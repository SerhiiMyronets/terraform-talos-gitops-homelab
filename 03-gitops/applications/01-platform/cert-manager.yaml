apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      path: 03-gitops/components/00-core/cert-manager

    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: 1.19.3
      helm:
        valueFiles:
          - $values/03-gitops/components/00-core/cert-manager/values.yaml

    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true