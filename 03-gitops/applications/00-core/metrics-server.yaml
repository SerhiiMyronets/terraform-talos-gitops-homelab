apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: core
  sources:
    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      path: 03-gitops/components/00-core/metrics-server

    - repoURL: https://kubernetes-sigs.github.io/metrics-server
      chart: metrics-server
      targetRevision: 3.13.0
      helm:
        valueFiles:
          - $values/03-gitops/components/00-core/metrics-server/values.yaml

    - repoURL: https://github.com/SerhiiMyronets/homelab-talos-kubernetes-terraform.git
      targetRevision: homelab
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {}
    syncOptions:
      - ServerSideApply=true