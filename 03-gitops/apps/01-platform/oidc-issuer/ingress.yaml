apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oidc-issuer
  namespace: oidc-issuer
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: k8s-issuer.serhii.link
      http:
        paths:
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend:
              service:
                name: nginx-issuer
                port:
                  number: 80
          - path: /openid/v1/jwks
            pathType: Exact
            backend:
              service:
                name: nginx-issuer
                port:
                  number: 80