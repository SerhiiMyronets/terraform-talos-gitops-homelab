apiVersion: v1
kind: ConfigMap
metadata:
  name: openid-config
  namespace: oidc-issuer
data:
  openid-configuration: |
    {
      "issuer": "https://k8s-issuer.serhii.link",
      "jwks_uri": "https://k8s-issuer.serhii.link/openid/v1/jwks",
      "response_types_supported": ["id_token"],
      "subject_types_supported": ["public"],
      "id_token_signing_alg_values_supported": ["RS256"]
    }
  nginx.conf: |
    worker_processes  1;
    events { worker_connections 1024; }
    http {

      sendfile on;
      server_tokens off;
      client_body_timeout 10s;
      proxy_read_timeout 10s;
    
      upstream jwks_upstream {
        server kubernetes.default.svc:443;
      }

      server {
        listen 80;
        server_name _;
    
        location = /.well-known/openid-configuration {
          default_type application/json;
          add_header Cache-Control "public, max-age=300";
          root /usr/share/nginx/html;
          try_files /openid-configuration =404;
        }
    
        location = /openid/v1/jwks {
          proxy_pass https://jwks_upstream$request_uri;
          proxy_http_version 1.1;
    
          proxy_ssl_server_name on;
          proxy_ssl_name kubernetes.default.svc;
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
          proxy_ssl_protocols TLSv1.2 TLSv1.3;
    
          proxy_set_header Authorization "";
          add_header Cache-Control "public, max-age=300";
        }
    
        location / {
          return 404;
        }
      }
    }