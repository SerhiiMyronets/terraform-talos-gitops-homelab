mode: standalone
existingSecret: minio-root-secret

buckets:
  - name: buildkit-cache
    policy: readwrite
    purge: false


persistence:
  enabled: true
  size: 10Gi
  storageClass: longhorn

consoleService:
  type: ClusterIP
  port: 9001

service:
  type: ClusterIP
  port: 9000

resources:
  requests:
    memory: 512Mi
    cpu: 250m