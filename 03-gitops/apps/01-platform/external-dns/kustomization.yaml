apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

namespace: external-dns

helmCharts:
  - name: external-dns
    repo: https://charts.bitnami.com/bitnami
    version: 9.0.0
    releaseName: bitnami/external-dns
    namespace: external-dns
    valuesFile: values.yaml

