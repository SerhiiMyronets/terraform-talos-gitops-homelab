apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: "https://infisical.home"
      auth:
        serviceToken:
          secretRef:
            name: infisical-eso
            namespace: external-secrets
            key: SERVICE_TOKEN
      defaults:
        projectId: "homelab"
        environment: "prod"
        secretPath: "/"