config:
  cookieDomain: ".serhii.link"
  redirectURL: "https://oauth.serhii.link/oauth2/callback"
  upstreams:
    - static://200
  existingSecret: oauth2-proxy-token
  configFile: |
    provider = "github"
    scope = "user:email read:org"
    email_domains = [ "*" ]
    cookie_domains = [ "*.serhii.link" ]
    whitelist_domains = [ ".serhii.link" ]
    cookie_secure = false


ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  hosts:
    - oauth.serhii.link