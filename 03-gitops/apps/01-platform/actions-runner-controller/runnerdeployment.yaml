apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: planeops-runner
  namespace: actions-runner-system
spec:
  replicas: 1
  template:
    spec:
      repository: planeops/ci-runners
      image: ghcr.io/planeops/ci-runners/runner-node-secured:latest
      labels:
        - node-secured
      containers:
        - name: docker
          image: docker:dind
          securityContext:
            privileged: true
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: dind-storage
          emptyDir: {}