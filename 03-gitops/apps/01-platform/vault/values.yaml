server:
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      config: |
        ui = true
        
        listener "tcp" {
          address     = "0.0.0.0:8200"
          cluster_address = "0.0.0.0:8201"
          tls_disable = 1
        }
        
        storage "raft" {
          path = "/vault/data"
        }
        
        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: "longhorn"

  extraEnvironmentVars:
    VAULT_LOG_LEVEL: "debug"

  service:
    enabled: true
    ports:
      - name: http
        port: 8200
        targetPort: 8200
      - name: cluster
        port: 8201
        targetPort: 8201
  serviceHeadless:
    enabled: true
    name: vault-internal
    ports:
      - name: http
        port: 8200
        targetPort: 8200
      - name: cluster
        port: 8201
        targetPort: 8201

injector:
  enabled: true

ui:
  enabled: true

