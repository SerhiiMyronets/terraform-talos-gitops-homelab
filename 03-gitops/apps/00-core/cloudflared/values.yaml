cloudflare:
  tunnelName: wildcard-tunnel
  secretName: cloudflared-credential-token

  ingress:
    - hostname: cluster.serhii.link
      service: https://kubernetes.default.svc:443
      originRequest:
        originServerName: kubernetes.default.svc.cluster.local
        caPool: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        noTLSVerify: false
    - hostname: "*.serhii.link"
      service: http://cilium-gateway-public-gw.networking.svc.cluster.local:80
#      service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80

replicaCount: 1

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  tag: 2025.11.1