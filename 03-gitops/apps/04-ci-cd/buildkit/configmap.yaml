apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: buildkit
data:
  buildkitd.toml: |
    [registry."harbor-harbor-core.harbor.svc.cluster.local"]
    insecure = true
    
    [registry."harbor-harbor-core.harbor.svc.cluster.local:443"]
    insecure = true

    [worker.oci]
    gc = true