apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buildkit-minio-secret
  namespace: buildkit
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-cloud
    kind: ClusterSecretStore
  target:
    name: buildkit-minio-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /minio/buildkit-accessKey
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /minio/buildkit-secretKey
    - secretKey: AWS_REGION
      remoteRef:
        key: /minio/buildkit-region
    - secretKey: AWS_BUCKET
      remoteRef:
        key: /minio/buildkit-bucket
