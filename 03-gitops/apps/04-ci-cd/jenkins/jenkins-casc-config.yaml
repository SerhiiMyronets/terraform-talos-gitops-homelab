apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-jcasc-config
  namespace: jenkins
  labels:
    jenkins-jenkins-config: "true"
data:
  jcasc.yaml: |
    jenkins:
      numExecutors: 0
      mode: NORMAL
      markupFormatter:
        plainText: {}
          
      systemMessage: "🔧 Jenkins configured via JCasC"
              
          
      clouds:
        - kubernetes:
            name: "kubernetes"
            serverUrl: "https://kubernetes.default"
            jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
            jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
            containerCapStr: "10"
            namespace: "jenkins"
    
    credentials:
      system:
        domainCredentials:
          - credentials:
              - string:
                  scope: GLOBAL
                  id: sonar-token
                  description: "SonarQube Token"
                  secret: ${SONAR_TOKEN}
              - usernamePassword:
                  scope: GLOBAL
                  id: github-shared-lib-token
                  description: "Github Shared Library Token"
                  username: "jenkins"
                  password: ${GITHUB_SHARED_LIB_TOKEN}
              - usernamePassword:
                  scope: GLOBAL
                  id: github-checkout-token
                  description: "Github Checkout Token"
                  username: "jenkins"
                  password: ${GITHUB_CHECKOUT_TOKEN}
                    
    unclassified:
      location:
        url: https://jenkins.cluster
      sonarGlobalConfiguration:
        buildWrapperEnabled: true
        installations:
        - credentialsId: "sonar-token"
          name: "SonarQube"
          serverUrl: "http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000"
      globalLibraries:
        libraries:
          - defaultVersion: "main"
            name: "jenkins-shared-lib"
            retriever:
              modernSCM:
                scm:
                  git:
                    id: jenkins-shared-lib
                    credentialsId: "github-shared-lib-token"
                    remote: "https://github.com/DevSecOps-homelab/jenkins-shared-lib"
                    traits:
                      - "gitBranchDiscovery"
    
    
    security:
      apiToken:
        creationOfLegacyTokenEnabled: false
        tokenGenerationOnCreationEnabled: false
        usageStatisticsEnabled: true
    
    appearance:
      prism:
        theme: PRISM
      themeManager:
        disableUserThemes: false
        theme: "darkSystem"
    
    jobs:
    - script: >
        multibranchPipelineJob('currencyservice') {
          branchSources {
            github {
              id('currencyservice-github')
              repoOwner('DevSecOps-homelab')
              repository('currencyservice')
              credentialsId('github-checkout-token')
            }
          }
          orphanedItemStrategy {
            discardOldItems {
              numToKeep(10)
            }
          }
          triggers {
            periodic(1) // періодичний скан гілок (в хвилинах)
          }
        }
