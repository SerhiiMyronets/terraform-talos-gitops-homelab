apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-jcasc-config
  namespace: jenkins
  labels:
    jenkins-jenkins-config: "true"
data:
  jcasc.yaml: |
    jenkins:
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousReadAccess: false
          
      systemMessage: "🔧 Jenkins configured via JCasC"
      
      securityRealm:
        local:
          allowsSignup: false
          enableCaptcha: false
          users:
            - id: admin
              name: Jenkins Admin
              password: ${JENKINS_ADMIN_PASSWORD}
              
        numExecutors: 0
        mode: NORMAL
        markupFormatter: "plainText"
      
          
      clouds:
        - kubernetes:
            name: "kubernetes"
            namespace: "jenkins"
            serverUrl: "https://kubernetes.default"
            jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
            jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
            containerCapStr: "10"
            templates:
              - name: "nodejs"
                label: "nodejs"
                containers:
                  - name: "node"
                    image: "node:18-alpine"
                    ttyEnabled: true
                    command: ["cat"]
                    
    unclassified:
      location:
        url: https://jenkins.local
        
    security:
      apiToken:
        creationOfLegacyTokenEnabled: false
        tokenGenerationOnCreationEnabled: false
        usageStatisticsEnabled: true