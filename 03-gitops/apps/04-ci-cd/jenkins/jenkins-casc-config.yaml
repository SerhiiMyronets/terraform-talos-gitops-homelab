apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-jcasc-config
  namespace: jenkins
  labels:
    jenkins-jenkins-config: "true"
data:
  jcasc.yaml: |
    jenkins:
      numExecutors: 0
      mode: NORMAL
      markupFormatter:
        plainText: {}
          
      systemMessage: "🔧 Jenkins configured via JCasC"
              
          
      clouds:
        - kubernetes:
            name: "kubernetes"
            namespace: "jenkins"
            serverUrl: "https://kubernetes.default"
            jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
            jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
            containerCapStr: "10"
            templates:
              - name: "nodejs"
                label: "nodejs"
                containers:
                  - name: "node"
                    image: "node:18-alpine"
                    ttyEnabled: true
                    command: ["cat"]
                    
    unclassified:
      location:
        url: https://jenkins.local
        
    security:
      apiToken:
        creationOfLegacyTokenEnabled: false
        tokenGenerationOnCreationEnabled: false
        usageStatisticsEnabled: true