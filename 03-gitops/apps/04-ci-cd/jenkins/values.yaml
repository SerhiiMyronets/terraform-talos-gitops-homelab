controller:
  installPlugins:
    - kubernetes
    - configuration-as-code
    - workflow-aggregator
    - git
    - dark-theme


  JCasC:
    enabled: true
    defaultConfig: false
    config: {}
    configMaps:
      - jenkins-jcasc-config
  authorizationStrategy: {}
  securityRealm: {}

persistence:
  enabled: true
  existingClaim: jenkins-home