controller:
  containerEnvFrom:
    - secretRef:
        name: sonar-token
    - secretRef:
        name: github-access-token

  installPlugins:
    - kubernetes
    - configuration-as-code
    - workflow-aggregator
    - workflow-job
    - git
    - dark-theme
    - pipeline-stage-view
    - ws-cleanup
    - sonar
    - github-branch-source
    - job-dsl


  JCasC:
    configScripts:
      jcasc: |
        <<: ((file("jcasc/config.yaml")))
  authorizationStrategy: {}
  securityRealm: {}

persistence:
  enabled: true
  existingClaim: jenkins-home