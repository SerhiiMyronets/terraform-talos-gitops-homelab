controller:
  containerEnvFrom:
    - secretRef:
        name: sonar-token
    - secretRef:
        name: github-shared-library-token



  installPlugins:
    - kubernetes
    - configuration-as-code
    - workflow-aggregator
    - git
    - dark-theme
    - pipeline-stage-view
    - ws-cleanup
    - sonar


  JCasC:
    enabled: true
    defaultConfig: false
    config: {}
    configMaps:
      - jenkins-jcasc-config
  authorizationStrategy: {}
  securityRealm: {}

persistence:
  enabled: true
  existingClaim: jenkins-home