apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: controller-manager
  namespace: github-actions-runner-set
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-cloud
    kind: ClusterSecretStore
  target:
    name: controller-manager
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: /github/actions-runner-creds/github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: /github/actions-runner-creds/github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: /github/actions-runner-creds/github_app_private_key